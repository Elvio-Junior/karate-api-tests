
name: API Tests - Karate

run-name: API Tests | ${{ inputs.environment || 'dev' }} | ${{ inputs.tags || 'Todas as tags' }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente para execução"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - hml
          - prod
      tags:
        description: "Tag dos cenários (ex.: @GET ou @SMOKE)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment || 'dev' }}

    env:
      TARGET_ENV: ${{ inputs.environment || 'dev' }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      KARATE_TAGS: ${{ inputs.tags || '' }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verificar configurações
        run: |
          java -version
          mvn -version

          if [ -z "$API_BASE_URL" ]; then
            echo "::error::API_BASE_URL não configurada no GitHub Environment."
            exit 1
          fi

          echo "Ambiente selecionado: $TARGET_ENV"
          echo "URL configurada: $API_BASE_URL"

      - name: Executar testes Karate
        run: |
          if [ -n "$KARATE_TAGS" ]; then
            mvn -B clean test \
              "-Dkarate.env=$TARGET_ENV" \
              "-Dkarate.tags=$KARATE_TAGS"
          else
            mvn -B clean test \
              "-Dkarate.env=$TARGET_ENV"
          fi

      - name: Gerar resumo dos testes
        if: always()
        run: |
          python - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          import os

          files = glob.glob("target/surefire-reports/TEST-*.xml")

          tests = failures = errors = skipped = 0

          for file in files:
              root = ET.parse(file).getroot()
              tests += int(root.attrib.get("tests", 0))
              failures += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))

          passed = tests - failures - errors - skipped

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("# Resultado dos testes Karate\n\n")
              summary.write(f"- **Ambiente:** {os.environ['TARGET_ENV']}\n")
              summary.write(f"- **Total:** {tests}\n")
              summary.write(f"- **Aprovados:** {passed}\n")
              summary.write(f"- **Falhas:** {failures}\n")
              summary.write(f"- **Erros:** {errors}\n")
              summary.write(f"- **Ignorados:** {skipped}\n")

              if not files:
                  summary.write("\n⚠️ Nenhum relatório XML do Surefire foi encontrado.\n")
          PY

      - name: Publicar relatórios do Karate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-reports-${{ inputs.environment || 'dev' }}
          path: |
            target/karate-reports/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
